name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        # Same command a developer runs. pythonpath includes the repo root so
        # `from tests.support import` collects under pytest 9.
        run: python -m pytest
