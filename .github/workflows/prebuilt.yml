# ARMv6 phone tools for a Pi Zero W. Debian's armhf is ARMv7, so this job
# debootstraps Raspbian Bookworm from archive.raspbian.org and compiles with
# -march=armv6. The tarball is a workflow artifact on every run. It is
# attached to a GitHub Release only when Phill pushes a prebuilt-* tag.
# This workflow does not create that tag.

name: prebuilt

# A new push to the same branch replaces a build that has not finished.
concurrency:
  group: prebuilt-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [cursor/sideload-pi, main]
    tags: ["prebuilt-*"]
  workflow_dispatch:

jobs:
  armv6:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Build in a Raspbian Bookworm armhf rootfs and check ARMv6
        run: bash scripts/ci-build-armv6.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sideload-pi-prebuilt-armv6
          path: |
            dist/sideload-pi-prebuilt-armv6.tar.gz
            dist/sideload-pi-prebuilt-armv6.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    needs: armv6
    if: startsWith(github.ref, 'refs/tags/prebuilt-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sideload-pi-prebuilt-armv6
          path: dist
      - name: Attach the tarball to the prebuilt tag's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "$tag" \
              --notes "ARMv6 (arm1176) zsign and libimobiledevice tools built from the pins in scripts/phone-stack.sh. Not a Debian armhf build."
          fi
          gh release upload "$tag" \
            dist/sideload-pi-prebuilt-armv6.tar.gz \
            dist/sideload-pi-prebuilt-armv6.tar.gz.sha256 \
            --clobber
